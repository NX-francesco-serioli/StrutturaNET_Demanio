version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: adsp_mds_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adsp
      POSTGRES_PASSWORD: adsp_password
      POSTGRES_DB: adsp_mds
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/AdspMds.Api
      dockerfile: Dockerfile
    container_name: adsp_mds_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=adsp_mds;Username=adsp;Password=adsp_password
      Jwt__Key: ${JWT_KEY:-SuperSecretDevelopmentKeyChangeMe!}
      Jwt__Issuer: AdspMds.Identity
      Jwt__Audience: AdspMds.Client
      Seed__AdminEmail: admin@local.test
      Seed__AdminPassword: ${ADMIN_PASSWORD:-ChangeMe123!}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./backend/AdspMds.Api:/src
    working_dir: /src
    command: ["dotnet", "watch", "run", "--urls", "http://0.0.0.0:8080"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adsp_mds_frontend
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    working_dir: /app
    command: ["npm", "run", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--disable-host-check"]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: adsp_mds_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.test
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db-data:
  frontend-node-modules:
